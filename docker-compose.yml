services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  # TideCloak dev: chạy riêng theo repo tide-foundation/tidecloak-gettingstarted
  # (image tideorg/tidecloak-dev:latest, console http://localhost:8080).

volumes:
  pgdata: